name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Only the project owner publishes. Collaborators can merge to main,
    # but a release they create (or a manual dispatch) will not reach npm.
    # The `npm-publish` environment adds a second gate: configure it in
    # Settings > Environments with the owner as required reviewer.
    if: github.actor == 'Ian-stetsenko'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - run: npm run typecheck

      - run: npm test

      - run: npm publish
